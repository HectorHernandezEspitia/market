name: Bot de inversiones
on:
  schedule:
    - cron: "17 22 * * *"   # 5:17 p. m. en Colombia, todos los días
  workflow_dispatch:         # permite ejecutarlo a mano
permissions:
  contents: write   # para guardar estado.json
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U yfinance requests
      - run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Guardar la memoria del bot
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || git commit -m "Actualiza estado del bot"
          git push
